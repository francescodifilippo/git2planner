# .github/workflows/git2planner.yml
name: git2planner

on:
  schedule:
    - cron: "*/30 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # "read" is enough with direction: git-to-planner
  id-token: write        # only needed for graph.auth: github_oidc

concurrency:
  group: git2planner
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Keeps the state file (issue <-> task baselines) between runs.
      - uses: actions/cache@v4
        with:
          path: .git2planner
          key: git2planner-${{ github.run_id }}
          restore-keys: git2planner-

      - uses: francescodifilippo/git2planner@v1
        with:
          config: git2planner.yml
          # args: --direction both
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
