name: git2planner
description: Sync GitHub issues with Microsoft Planner tasks (one way or both ways).
author: FrancescoDF
branding:
  icon: check-square
  color: blue

inputs:
  config:
    description: Path of the configuration file.
    default: git2planner.yml
  command:
    description: git2planner command to run (sync, validate, ...).
    default: sync
  args:
    description: Extra arguments for the command, e.g. "--direction both --only backend".
    default: ""
  dry-run:
    description: Show what would change without writing anything ("true" or "false").
    default: "false"
  python-version:
    description: Python version used to run git2planner.
    default: "3.12"

outputs:
  report:
    description: JSON report of the sync (only for the sync command).
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install git2planner
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}

    - name: Run git2planner
      id: run
      shell: bash
      env:
        G2P_CONFIG: ${{ inputs.config }}
        G2P_COMMAND: ${{ inputs.command }}
        G2P_ARGS: ${{ inputs.args }}
        G2P_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        extra=()
        if [ "$G2P_COMMAND" = "sync" ]; then
          extra+=(--json)
          if [ "$G2P_DRY_RUN" = "true" ]; then extra+=(--dry-run); fi
        fi
        # shellcheck disable=SC2086
        set +e
        git2planner -c "$G2P_CONFIG" "$G2P_COMMAND" "${extra[@]}" $G2P_ARGS > "$RUNNER_TEMP/git2planner.out"
        status=$?
        set -e
        cat "$RUNNER_TEMP/git2planner.out"
        if [ "$G2P_COMMAND" = "sync" ]; then
          {
            echo "report<<GIT2PLANNER_EOF"
            cat "$RUNNER_TEMP/git2planner.out"
            echo "GIT2PLANNER_EOF"
          } >> "$GITHUB_OUTPUT"
        fi
        exit $status
